# https://taskfile.dev
#
# Each assignment is a uv script (PEP 723 header in the .py file).
# Task names match ticket slugs: knn, scaled, metrics, ...
version: '3'

vars:
  DATA: 'learning/resources/data/small.arff'
  K: '3'
  DISTANCE: '1' # 1=euclidean, 2=manhattan, 3=minkowski
  P: '3.0'      # minkowski exponent, only used when DISTANCE=3
  WINDOW: '50'
  NORMALIZE: 'none' # none | zscore | minmax
  TASK: 'multiclass' # multiclass | binary
  K_GRID: '1,3,5,7,9'
  DATA_ABS: '{{if hasPrefix "/" .DATA}}{{.DATA}}{{else}}{{.ROOT_DIR}}/{{.DATA}}{{end}}'

tasks:
  default:
    cmds:
      - task: setup

  setup:
    desc: Verify uv is installed (dependencies live in each script header)
    cmds:
      - uv --version

  uv:
    desc: 'uv ticket: run the hello script'
    cmds:
      - uv run {{.ROOT_DIR}}/learning/uv/hello.py

  generate-stream:
    desc: 'Regenerate drifting stream ARFF files'
    cmds:
      - uv run {{.ROOT_DIR}}/learning/resources/generate_stream.py {{.ROOT_DIR}}/learning/resources/data/small.arff --output {{.ROOT_DIR}}/learning/resources/data/small_stream.arff --length 800 --drift 400 --seed 5
      - uv run {{.ROOT_DIR}}/learning/resources/generate_stream.py {{.ROOT_DIR}}/learning/resources/data/medium.arff --output {{.ROOT_DIR}}/learning/resources/data/medium_stream.arff --length 2000 --drift 1000 --seed 5

  issues:
    desc: 'Create GitHub issues from issues/*.md (requires gh auth)'
    cmds:
      - uv run {{.ROOT_DIR}}/scripts/create_issues.py

  github-rules:
    desc: 'Apply main-branch ruleset (no direct push; PRs need review)'
    cmds:
      - uv run {{.ROOT_DIR}}/scripts/setup_github_rules.py

  lint-commits:
    desc: 'Check commit subjects from origin/main to HEAD'
    cmds:
      - python3 {{.ROOT_DIR}}/scripts/lint_commits.py --base origin/main --head HEAD

  knn:
    desc: 'pa-knn: leave-one-out kNN'
    dir: learning/pa-knn
    cmds:
      - uv run kNN.py {{.DATA_ABS}} --distance {{.DISTANCE}} --k {{.K}} --p {{.P}}

  scaled:
    desc: 'pa-scaled: normalize + binary vs multiclass'
    dir: learning/pa-scaled
    cmds:
      - uv run kNN_scaled.py {{.DATA_ABS}} --distance {{.DISTANCE}} --k {{.K}} --p {{.P}} --normalize {{.NORMALIZE}} --task {{.TASK}}

  metrics:
    desc: 'pa-metrics: baseline, per-class metrics, plots'
    dir: learning/pa-metrics
    cmds:
      - uv run kNN_report.py {{.DATA_ABS}} --distance {{.DISTANCE}} --k {{.K}} --p {{.P}} --normalize {{.NORMALIZE}}

  selection:
    desc: 'pa-selection: choose k; vote fractions'
    dir: learning/pa-selection
    cmds:
      - uv run kNN_select.py {{.DATA_ABS}} --k-grid {{.K_GRID}} --distance {{.DISTANCE}} --p {{.P}} --normalize {{.NORMALIZE}}

  ensemble:
    desc: 'pa-ensemble: bagged kNN + distance committee'
    dir: learning/pa-ensemble
    cmds:
      - uv run kNN_ensemble.py {{.DATA_ABS}} --k {{.K}} --normalize {{.NORMALIZE}}

  gpu:
    desc: 'pa-gpu: vectorized / GPU kNN'
    dir: learning/pa-gpu
    cmds:
      - uv run knn_gpu.py {{.DATA_ABS}} --k {{.K}} --normalize {{.NORMALIZE}}

  online:
    desc: 'pa-online: sliding-window kNN'
    dir: learning/pa-online
    cmds:
      - uv run online_knn.py {{.ROOT_DIR}}/learning/resources/data/small_stream.arff --k {{.K}} --window {{.WINDOW}}

  online:weighted:
    desc: 'pa-online with inverse-frequency votes'
    dir: learning/pa-online
    cmds:
      - uv run online_knn.py {{.ROOT_DIR}}/learning/resources/data/small_stream.arff --k {{.K}} --window {{.WINDOW}} --weighted-vote
