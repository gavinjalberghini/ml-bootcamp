name: commit-message

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        run: |
          python3 scripts/lint_commits.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}"
